<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="auroraSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040a14"/>
      <stop offset=".4" stop-color="#071a2b"/>
      <stop offset=".72" stop-color="#0a2b3a"/>
      <stop offset="1" stop-color="#123a45"/>
    </linearGradient>
    <linearGradient id="ribbon1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3dffd0" stop-opacity="0"/>
      <stop offset=".3" stop-color="#4dffc8" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#59b8ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a06bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6bff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#a06bff" stop-opacity=".38"/>
      <stop offset=".7" stop-color="#43f0d4" stop-opacity=".42"/>
      <stop offset="1" stop-color="#43f0d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3540"/>
      <stop offset="1" stop-color="#04121a"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2230"/>
      <stop offset="1" stop-color="#040c14"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softer" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <radialGradient id="vig3" cx=".5" cy=".4" r=".8">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#auroraSky)"/>

  <!-- stars -->
  <g fill="#dff9ff">
    <circle cx="140" cy="90" r="1.5"/><circle cx="300" cy="140" r="1"/><circle cx="470" cy="70" r="1.3"/>
    <circle cx="640" cy="130" r=".9"/><circle cx="820" cy="60" r="1.2"/><circle cx="990" cy="120" r="1.4"/>
    <circle cx="1150" cy="70" r="1"/><circle cx="1330" cy="140" r="1.3"/><circle cx="1490" cy="80" r="1.1"/>
    <circle cx="220" cy="220" r=".8"/><circle cx="560" cy="210" r=".9"/><circle cx="900" cy="200" r=".8"/>
    <circle cx="1240" cy="230" r="1"/><circle cx="1450" cy="260" r=".9"/>
  </g>

  <!-- aurora ribbons -->
  <g filter="url(#softer)" opacity=".85">
    <path d="M-100 250 C 220 90, 420 330, 760 210 C 1000 130, 1200 260, 1700 120" stroke="url(#ribbon1)" stroke-width="90" fill="none" stroke-linecap="round"/>
    <path d="M-100 330 C 260 190, 480 420, 820 300 C 1080 210, 1260 360, 1700 240" stroke="url(#ribbon2)" stroke-width="70" fill="none" stroke-linecap="round"/>
    <path d="M-60 420 C 300 320, 520 500, 900 380 C 1160 300, 1340 430, 1700 330" stroke="url(#ribbon1)" stroke-width="46" fill="none" stroke-linecap="round" opacity=".7"/>
  </g>
  <g filter="url(#soft)" opacity=".55">
    <path d="M-100 250 C 220 90, 420 330, 760 210 C 1000 130, 1200 260, 1700 120" stroke="#5effd8" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M-100 330 C 260 190, 480 420, 820 300 C 1080 210, 1260 360, 1700 240" stroke="#a07bff" stroke-width="20" fill="none" stroke-linecap="round"/>
  </g>

  <!-- mountains -->
  <path d="M0 640 L140 520 L260 610 L400 470 L540 620 L660 540 L800 650 L950 500 L1100 640 L1240 540 L1400 630 L1520 560 L1600 620 L1600 760 L0 760 Z" fill="#081a25"/>
  <path d="M400 470 L455 545 L420 540 L480 610 L400 620 L330 555 L370 560 Z" fill="#e8fbff" opacity=".35"/>
  <path d="M950 500 L1005 570 L965 565 L1030 640 L950 650 L880 580 L925 585 Z" fill="#e8fbff" opacity=".3"/>

  <!-- lake -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#lake)"/>
  <g opacity=".5">
    <rect x="0" y="706" width="1600" height="2" fill="#79ffe2"/>
    <rect x="240" y="726" width="320" height="1.4" fill="#79ffe2" opacity=".7"/>
    <rect x="900" y="740" width="420" height="1.4" fill="#79ffe2" opacity=".6"/>
    <rect x="480" y="770" width="300" height="1.2" fill="#79ffe2" opacity=".5"/>
    <rect x="1120" y="800" width="340" height="1.2" fill="#79ffe2" opacity=".4"/>
    <rect x="120" y="830" width="260" height="1" fill="#79ffe2" opacity=".35"/>
  </g>
  <!-- aurora reflection -->
  <g filter="url(#softer)" opacity=".35">
    <path d="M-100 820 C 300 760, 620 880, 1000 800 C 1250 750, 1450 830, 1700 780" stroke="#4dffc8" stroke-width="44" fill="none"/>
  </g>

  <!-- foreground rocks / silhouette -->
  <path d="M0 900 L0 860 q60 -26 140 -8 q40 100 0 48z" fill="#02080d"/>
  <path d="M1600 900 L1600 850 q-90 -30 -180 -4 q-30 70 10 54z" fill="#02080d"/>

  <rect width="1600" height="900" fill="url(#vig3)"/>
</svg>
