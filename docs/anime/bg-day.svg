<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="daySky" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#9fd7ff"/>
      <stop offset=".38" stop-color="#c6eaff"/>
      <stop offset=".68" stop-color="#e8f6ff"/>
      <stop offset=".88" stop-color="#ffe9f4"/>
      <stop offset="1" stop-color="#ffe3ee"/>
    </linearGradient>
    <radialGradient id="daySun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffbe8" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ffe6a8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffd6a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloudBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".65" stop-color="#f6fbff"/>
      <stop offset="1" stop-color="#dfeaff"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d3f7"/>
      <stop offset="1" stop-color="#cfe2fb"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7d7c9"/>
      <stop offset="1" stop-color="#c8ecdf"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fcdbb"/>
      <stop offset="1" stop-color="#b6e5d4"/>
    </linearGradient>
    <radialGradient id="dayVig" cx=".5" cy=".4" r=".85">
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#bcd8ff" stop-opacity=".18"/>
    </radialGradient>
    <g id="cloudPuff">
      <ellipse cx="0" cy="0" rx="96" ry="42" fill="url(#cloudBody)"/>
      <ellipse cx="-62" cy="10" rx="58" ry="28" fill="url(#cloudBody)"/>
      <ellipse cx="58" cy="12" rx="66" ry="30" fill="url(#cloudBody)"/>
      <ellipse cx="12" cy="-22" rx="54" ry="34" fill="url(#cloudBody)"/>
      <ellipse cx="-20" cy="20" rx="80" ry="22" fill="#eaf4ff" opacity=".85"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#daySky)"/>
  <circle cx="1310" cy="180" r="300" fill="url(#daySun)"/>

  <!-- clouds -->
  <g opacity=".96">
    <use href="#cloudPuff" transform="translate(250 230) scale(1.25)"/>
    <use href="#cloudPuff" transform="translate(760 130) scale(.85)"/>
    <use href="#cloudPuff" transform="translate(1180 300) scale(1.05)"/>
    <use href="#cloudPuff" transform="translate(1480 150) scale(.7)"/>
    <use href="#cloudPuff" transform="translate(520 380) scale(.6)" opacity=".8"/>
    <use href="#cloudPuff" transform="translate(1000 430) scale(.55)" opacity=".7"/>
  </g>

  <!-- birds -->
  <g stroke="#6f86b8" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".65">
    <path d="M600 260 q9 -8 18 0 q9 -8 18 0"/>
    <path d="M660 290 q7 -7 14 0 q7 -7 14 0"/>
    <path d="M560 305 q6 -6 12 0 q6 -6 12 0"/>
    <path d="M1320 430 q5 -5 10 0 q5 -5 10 0"/>
  </g>

  <!-- far mountains -->
  <path d="M0 560 L120 470 L240 545 L360 450 L480 550 L600 480 L720 560 L840 470 L960 550 L1080 480 L1200 555 L1320 475 L1440 550 L1560 490 L1600 525 L1600 900 L0 900 Z" fill="url(#hillFar)" opacity=".85"/>
  <g fill="#ffffff" opacity=".55">
    <path d="M312 480 L360 450 L404 484 L378 478 L360 492 L344 480 Z"/>
    <path d="M792 492 L840 470 L880 496 L856 492 L840 504 L822 494 Z"/>
    <path d="M1272 494 L1320 475 L1360 498 L1336 494 L1320 506 L1302 496 Z"/>
  </g>

  <!-- mid hills -->
  <path d="M0 700 Q240 600 460 690 Q680 780 900 690 Q1120 600 1340 690 Q1500 750 1600 705 L1600 900 L0 900 Z" fill="url(#hillMid)"/>

  <!-- sakura trees on hills -->
  <g>
    <g transform="translate(180 690)">
      <path d="M0 50 q-4 -26 4 -40" stroke="#8a6a78" stroke-width="5" fill="none" stroke-linecap="round"/>
      <g fill="#ffc2dc">
        <circle cx="-14" cy="4" r="18"/><circle cx="10" cy="-4" r="22"/><circle cx="28" cy="12" r="15"/><circle cx="-2" cy="18" r="14"/>
      </g>
      <g fill="#ffe0ee" opacity=".9"><circle cx="2" cy="-10" r="12"/><circle cx="-16" cy="8" r="9"/></g>
    </g>
    <g transform="translate(320 730) scale(.8)">
      <path d="M0 50 q-4 -26 4 -40" stroke="#8a6a78" stroke-width="5" fill="none" stroke-linecap="round"/>
      <g fill="#ffc2dc"><circle cx="-14" cy="4" r="18"/><circle cx="10" cy="-4" r="22"/><circle cx="28" cy="12" r="15"/><circle cx="-2" cy="18" r="14"/></g>
      <g fill="#ffe0ee" opacity=".9"><circle cx="2" cy="-10" r="12"/><circle cx="-16" cy="8" r="9"/></g>
    </g>
    <g transform="translate(1420 720) scale(1.1)">
      <path d="M0 50 q-4 -26 4 -40" stroke="#8a6a78" stroke-width="5" fill="none" stroke-linecap="round"/>
      <g fill="#ffc2dc"><circle cx="-14" cy="4" r="18"/><circle cx="10" cy="-4" r="22"/><circle cx="28" cy="12" r="15"/><circle cx="-2" cy="18" r="14"/></g>
      <g fill="#ffe0ee" opacity=".9"><circle cx="2" cy="-10" r="12"/><circle cx="-16" cy="8" r="9"/></g>
    </g>
    <g transform="translate(1540 690) scale(.9)">
      <path d="M0 50 q-4 -26 4 -40" stroke="#8a6a78" stroke-width="5" fill="none" stroke-linecap="round"/>
      <g fill="#ffc2dc"><circle cx="-14" cy="4" r="18"/><circle cx="10" cy="-4" r="22"/><circle cx="28" cy="12" r="15"/><circle cx="-2" cy="18" r="14"/></g>
    </g>
  </g>

  <!-- near hill -->
  <path d="M0 810 Q300 740 620 805 Q940 870 1220 800 Q1410 755 1600 800 L1600 900 L0 900 Z" fill="url(#hillNear)"/>

  <!-- grass tufts -->
  <g stroke="#6fb8a2" stroke-width="2" fill="none" opacity=".55" stroke-linecap="round">
    <path d="M120 860 q6 -18 14 -24"/><path d="M136 864 q2 -16 10 -24"/>
    <path d="M980 850 q6 -18 14 -24"/><path d="M996 856 q2 -16 10 -24"/>
    <path d="M1380 862 q6 -16 14 -22"/><path d="M1396 866 q2 -14 10 -22"/>
  </g>

  <!-- petals -->
  <g fill="#ffc2dc" opacity=".8">
    <ellipse cx="460" cy="520" rx="6" ry="3.4" transform="rotate(30 460 520)"/>
    <ellipse cx="820" cy="600" rx="5" ry="2.8" transform="rotate(-20 820 600)"/>
    <ellipse cx="1180" cy="540" rx="6" ry="3.2" transform="rotate(60 1180 540)"/>
    <ellipse cx="640" cy="700" rx="5" ry="2.8" transform="rotate(14 640 700)"/>
    <ellipse cx="1500" cy="620" rx="5" ry="2.8" transform="rotate(-46 1500 620)"/>
  </g>

  <rect width="1600" height="900" fill="url(#dayVig)"/>
</svg>
