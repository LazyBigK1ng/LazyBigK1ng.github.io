<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#fff7fb"/>
      <stop offset=".45" stop-color="#ffeef6"/>
      <stop offset=".78" stop-color="#f6e9ff"/>
      <stop offset="1" stop-color="#e8f0ff"/>
    </linearGradient>
    <radialGradient id="warm" cx=".72" cy=".18" r=".55">
      <stop offset="0" stop-color="#fff3d0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffe3ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blossomGrad2" cx=".45" cy=".55" r=".65">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#ffe2ee"/>
      <stop offset="1" stop-color="#ffb8d5"/>
    </radialGradient>
    <linearGradient id="branch2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9788b"/>
      <stop offset="1" stop-color="#7d5266"/>
    </linearGradient>
    <radialGradient id="vignette2" cx=".5" cy=".45" r=".85">
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#f3d9ea" stop-opacity=".55"/>
    </radialGradient>
    <g id="blossom2">
      <ellipse cx="0" cy="-12" rx="8" ry="12" fill="url(#blossomGrad2)"/>
      <ellipse cx="0" cy="-12" rx="8" ry="12" fill="url(#blossomGrad2)" transform="rotate(72)"/>
      <ellipse cx="0" cy="-12" rx="8" ry="12" fill="url(#blossomGrad2)" transform="rotate(144)"/>
      <ellipse cx="0" cy="-12" rx="8" ry="12" fill="url(#blossomGrad2)" transform="rotate(216)"/>
      <ellipse cx="0" cy="-12" rx="8" ry="12" fill="url(#blossomGrad2)" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="3.6" fill="#ff87b4"/>
      <g stroke="#ff5f9e" stroke-width="1.2" stroke-linecap="round">
        <path d="M0 -2 v-6"/><path d="M0 -2 l5 -4"/><path d="M0 -2 l-5 -4"/>
      </g>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#cream)"/>
  <circle cx="1210" cy="150" r="520" fill="url(#warm)"/>

  <!-- light rays -->
  <g opacity=".35">
    <path d="M1360 -80 L1560 -80 L900 900 L760 900 Z" fill="#fff" opacity=".5"/>
    <path d="M1200 -80 L1280 -80 L700 900 L620 900 Z" fill="#fff" opacity=".35"/>
  </g>

  <!-- bokeh -->
  <g fill="#ffd6e7" opacity=".55">
    <circle cx="240" cy="330" r="46"/><circle cx="380" cy="240" r="26"/>
    <circle cx="1320" cy="560" r="56"/><circle cx="1450" cy="400" r="30"/>
    <circle cx="700" cy="180" r="22"/><circle cx="860" cy="760" r="38"/>
    <circle cx="120" cy="700" r="34"/><circle cx="1050" cy="120" r="18"/>
  </g>
  <g fill="#e2d6ff" opacity=".5">
    <circle cx="520" cy="640" r="52"/><circle cx="1520" cy="700" r="44"/>
    <circle cx="980" cy="480" r="30"/>
  </g>

  <!-- top-left branch -->
  <g>
    <path d="M-40 40 q180 40 300 130 q96 72 190 96" stroke="url(#branch2)" stroke-width="17" fill="none" stroke-linecap="round"/>
    <path d="M170 118 q30 92 6 158" stroke="url(#branch2)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M60 62 q66 4 96 44" stroke="url(#branch2)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M330 200 q-8 76 38 118" stroke="url(#branch2)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M420 262 q58 -6 96 24" stroke="url(#branch2)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <use href="#blossom2" transform="translate(120 96) rotate(20) scale(1.7)"/>
    <use href="#blossom2" transform="translate(210 170) rotate(-30) scale(1.25)"/>
    <use href="#blossom2" transform="translate(160 262) rotate(50) scale(1.35)"/>
    <use href="#blossom2" transform="translate(300 214) rotate(10) scale(1.1)"/>
    <use href="#blossom2" transform="translate(352 306) rotate(-50) scale(1.45)"/>
    <use href="#blossom2" transform="translate(62 118) rotate(70) scale(1.15)"/>
    <use href="#blossom2" transform="translate(470 340) rotate(24) scale(1.2)"/>
    <use href="#blossom2" transform="translate(430 220) rotate(-8) scale(.95)"/>
    <use href="#blossom2" transform="translate(196 64) rotate(44) scale(.9)"/>
    <use href="#blossom2" transform="translate(520 268) rotate(66) scale(1.05)"/>
    <use href="#blossom2" transform="translate(250 330) rotate(-14) scale(.85)"/>
  </g>

  <!-- bottom-right branch -->
  <g>
    <path d="M1640 860 q-160 -20 -280 -110 q-110 -84 -230 -100" stroke="url(#branch2)" stroke-width="19" fill="none" stroke-linecap="round"/>
    <path d="M1360 750 q-38 -86 -14 -150" stroke="url(#branch2)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M1420 806 q-50 -8 -74 -44" stroke="url(#branch2)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M1180 660 q20 -78 -22 -124" stroke="url(#branch2)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <use href="#blossom2" transform="translate(1360 690) rotate(18) scale(1.6)"/>
    <use href="#blossom2" transform="translate(1300 790) rotate(-34) scale(1.2)"/>
    <use href="#blossom2" transform="translate(1450 760) rotate(52) scale(1.3)"/>
    <use href="#blossom2" transform="translate(1200 660) rotate(-12) scale(1.1)"/>
    <use href="#blossom2" transform="translate(1150 560) rotate(64) scale(1.35)"/>
    <use href="#blossom2" transform="translate(1520 830) rotate(-44) scale(1.2)"/>
    <use href="#blossom2" transform="translate(1080 620) rotate(30) scale(.9)"/>
    <use href="#blossom2" transform="translate(1260 540) rotate(-60) scale(.95)"/>
    <use href="#blossom2" transform="translate(1580 700) rotate(8) scale(1.05)"/>
  </g>

  <!-- petals -->
  <g fill="#ffc3dd" opacity=".85">
    <ellipse cx="760" cy="300" rx="7" ry="3.6" transform="rotate(30 760 300)"/>
    <ellipse cx="900" cy="420" rx="6" ry="3.2" transform="rotate(-20 900 420)"/>
    <ellipse cx="620" cy="520" rx="5.5" ry="3" transform="rotate(60 620 520)"/>
    <ellipse cx="1080" cy="330" rx="6.5" ry="3.4" transform="rotate(14 1080 330)"/>
    <ellipse cx="480" cy="420" rx="5" ry="2.8" transform="rotate(-46 480 420)"/>
    <ellipse cx="840" cy="620" rx="6" ry="3.2" transform="rotate(76 840 620)"/>
    <ellipse cx="1180" cy="240" rx="5" ry="2.8" transform="rotate(36 1180 240)"/>
  </g>

  <rect width="1600" height="900" fill="url(#vignette2)"/>
</svg>
