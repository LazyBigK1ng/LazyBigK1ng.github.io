<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140b2b"/>
      <stop offset=".32" stop-color="#3b1c55"/>
      <stop offset=".58" stop-color="#8b3a70"/>
      <stop offset=".76" stop-color="#dd6f7e"/>
      <stop offset=".9" stop-color="#ffb187"/>
      <stop offset="1" stop-color="#ffe3bd"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6dd" stop-opacity=".9"/>
      <stop offset=".4" stop-color="#ffcf94" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff9a7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCore" cx=".42" cy=".38" r=".62">
      <stop offset="0" stop-color="#fffdf3"/>
      <stop offset=".55" stop-color="#ffe3b0"/>
      <stop offset="1" stop-color="#ffc087"/>
    </radialGradient>
    <linearGradient id="cloudWarm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9fb0" stop-opacity="0"/>
      <stop offset=".35" stop-color="#ffb6ae" stop-opacity=".85"/>
      <stop offset=".7" stop-color="#ffd9b3" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffe6c2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cloudCool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b98ad8" stop-opacity="0"/>
      <stop offset=".45" stop-color="#c9a0e0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8f6bc0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1f38"/>
      <stop offset="1" stop-color="#1b0f24"/>
    </linearGradient>
    <radialGradient id="blossomGrad" cx=".5" cy=".6" r=".7">
      <stop offset="0" stop-color="#ffe6f1"/>
      <stop offset=".55" stop-color="#ffc2da"/>
      <stop offset="1" stop-color="#ff9dc4"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".42" r=".78">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0418" stop-opacity=".55"/>
    </radialGradient>
    <g id="blossom">
      <ellipse cx="0" cy="-11" rx="7.5" ry="11" fill="url(#blossomGrad)"/>
      <ellipse cx="0" cy="-11" rx="7.5" ry="11" fill="url(#blossomGrad)" transform="rotate(72)"/>
      <ellipse cx="0" cy="-11" rx="7.5" ry="11" fill="url(#blossomGrad)" transform="rotate(144)"/>
      <ellipse cx="0" cy="-11" rx="7.5" ry="11" fill="url(#blossomGrad)" transform="rotate(216)"/>
      <ellipse cx="0" cy="-11" rx="7.5" ry="11" fill="url(#blossomGrad)" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="3.4" fill="#ff5f9e"/>
      <circle cx="-1" cy="-1" r="1.1" fill="#ffdce9"/>
    </g>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff" opacity=".85">
    <circle cx="120" cy="90" r="1.6"/><circle cx="240" cy="160" r="1.1"/>
    <circle cx="360" cy="70" r="1.4"/><circle cx="480" cy="140" r="1"/>
    <circle cx="640" cy="60" r="1.7"/><circle cx="760" cy="120" r="1.2"/>
    <circle cx="900" cy="70" r="1.3"/><circle cx="1060" cy="150" r="1.6"/>
    <circle cx="1220" cy="80" r="1.1"/><circle cx="1380" cy="130" r="1.8"/>
    <circle cx="1500" cy="60" r="1.2"/><circle cx="180" cy="260" r=".9"/>
    <circle cx="330" cy="230" r="1.1"/><circle cx="560" cy="240" r=".8"/>
    <circle cx="820" cy="200" r="1"/><circle cx="1140" cy="240" r=".9"/>
    <circle cx="1340" cy="220" r="1.2"/><circle cx="1460" cy="300" r=".8"/>
  </g>
  <g opacity=".55" fill="#c8b4ff">
    <circle cx="280" cy="110" r="2.4"/><circle cx="700" cy="170" r="2"/>
    <circle cx="1180" cy="120" r="2.6"/><circle cx="1420" cy="200" r="2"/>
  </g>

  <!-- shooting star -->
  <g opacity=".75">
    <path d="M1090 190 L1240 150" stroke="#ffe9c9" stroke-width="2" stroke-linecap="round" opacity=".9"/>
    <path d="M1090 190 L1240 150" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".18"/>
    <circle cx="1088" cy="191" r="2.6" fill="#fff"/>
  </g>

  <!-- sun -->
  <circle cx="1170" cy="545" r="300" fill="url(#sunGlow)"/>
  <circle cx="1170" cy="545" r="86" fill="url(#sunCore)"/>

  <!-- clouds -->
  <g opacity=".9">
    <path d="M620 470 q70 -46 165 -30 q66 -54 158 -22 q86 -12 120 32 q74 -6 96 34 q-40 26 -120 20 q-60 30 -160 14 q-100 22 -170 -6 q-70 4 -89 -42z" fill="url(#cloudWarm)"/>
    <path d="M120 545 q56 -40 140 -26 q60 -44 138 -14 q78 -6 96 30 q-46 22 -120 14 q-68 26 -150 8 q-70 12 -104 -12z" fill="url(#cloudCool)"/>
    <path d="M880 350 q52 -34 122 -22 q48 -40 118 -14 q66 -4 84 24 q-42 20 -108 14 q-56 22 -128 8 q-60 10 -88 -10z" fill="url(#cloudWarm)" opacity=".55"/>
    <path d="M180 330 q40 -26 96 -18 q44 -30 104 -10 q58 -4 70 20 q-34 16 -92 10 q-48 18 -104 6 q-52 8 -74 -8z" fill="url(#cloudCool)" opacity=".7"/>
  </g>

  <!-- birds -->
  <g stroke="#2a1533" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".75">
    <path d="M840 300 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M900 330 q7 -7 14 0 q7 -7 14 0"/>
    <path d="M790 345 q6 -6 12 0 q6 -6 12 0"/>
    <path d="M960 290 q5 -5 10 0 q5 -5 10 0"/>
  </g>

  <!-- far mountains -->
  <path d="M0 655 L110 570 L190 620 L300 520 L410 625 L520 560 L640 655 L760 575 L880 645 L1000 550 L1120 630 L1240 560 L1360 655 L1480 585 L1600 645 L1600 900 L0 900 Z" fill="#2b1745" opacity=".9"/>
  <!-- mid mountains -->
  <path d="M0 730 L150 645 L290 720 L430 630 L590 725 L750 655 L920 735 L1080 645 L1240 730 L1400 660 L1600 745 L1600 900 L0 900 Z" fill="#1c1033"/>

  <!-- hill -->
  <path d="M0 840 Q280 720 560 812 Q820 890 1080 800 Q1320 720 1600 828 L1600 900 L0 900 Z" fill="#100a20"/>

  <!-- torii gate -->
  <g fill="#0d0718">
    <path d="M250 606 q-8 4 -6 12 l16 4 q2 -8 10 -8 l4 -8z" opacity="0"/>
    <!-- pillars -->
    <path d="M262 622 l14 -4 l6 190 l-16 2 z"/>
    <path d="M372 618 l14 4 l-4 188 l-16 -2 z"/>
    <!-- nuki -->
    <path d="M246 648 h160 v15 h-160 z"/>
    <!-- kasagi (curved top beam) -->
    <path d="M228 600 q86 -18 196 -4 q10 2 8 10 l-4 12 q-98 -14 -196 6 l-6 -12 q-2 -8 2 -12z"/>
    <!-- shimaki -->
    <path d="M252 622 q72 -12 146 -3 l-2 10 q-70 -9 -142 2z"/>
    <!-- center plaque -->
    <path d="M308 632 h30 v14 h-30 z"/>
  </g>
  <g stroke="#ffb9a6" stroke-width="1.4" opacity=".35">
    <path d="M262 626 l6 184" fill="none"/>
    <path d="M382 626 l-4 184" fill="none"/>
    <path d="M248 604 q90 -16 190 -4" fill="none"/>
  </g>

  <!-- foreground branches -->
  <g>
    <path d="M1600 30 q-120 40 -190 120 q-70 80 -150 110 q-46 18 -66 56" stroke="url(#branch)" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M1460 96 q-24 60 -8 116" stroke="url(#branch)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M1520 58 q-70 6 -96 44" stroke="url(#branch)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M1340 250 q-46 26 -58 74" stroke="url(#branch)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M1430 190 q40 10 58 44" stroke="url(#branch)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <use href="#blossom" transform="translate(1488 84) rotate(18) scale(1.45)"/>
    <use href="#blossom" transform="translate(1430 150) rotate(-24) scale(1.15)"/>
    <use href="#blossom" transform="translate(1366 200) rotate(40) scale(1.3)"/>
    <use href="#blossom" transform="translate(1300 276) rotate(-12) scale(1.05)"/>
    <use href="#blossom" transform="translate(1240 330) rotate(55) scale(1.2)"/>
    <use href="#blossom" transform="translate(1210 92) rotate(70) scale(1.1)"/>
    <use href="#blossom" transform="translate(1352 108) rotate(-40) scale(.95)"/>
    <use href="#blossom" transform="translate(1528 240) rotate(28) scale(1.05)"/>
    <use href="#blossom" transform="translate(1268 415) rotate(12) scale(.9)"/>
    <use href="#blossom" transform="translate(1570 160) rotate(-18) scale(1.25)"/>
  </g>
  <g opacity=".9">
    <path d="M0 900 q40 -110 150 -160 q70 -32 120 -84" stroke="url(#branch)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M96 806 q56 -4 84 34" stroke="url(#branch)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M160 700 q-14 -46 6 -80" stroke="url(#branch)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <use href="#blossom" transform="translate(118 760) rotate(-30) scale(1.35)"/>
    <use href="#blossom" transform="translate(60 826) rotate(20) scale(1.1)"/>
    <use href="#blossom" transform="translate(192 660) rotate(50) scale(1.2)"/>
    <use href="#blossom" transform="translate(238 560) rotate(-10) scale(.95)"/>
    <use href="#blossom" transform="translate(190 828) rotate(65) scale(1)"/>
    <use href="#blossom" transform="translate(30 700) rotate(85) scale(.85)"/>
  </g>

  <!-- drifting petals -->
  <g fill="#ffc9de" opacity=".8">
    <ellipse cx="980" cy="430" rx="6" ry="3.4" transform="rotate(28 980 430)"/>
    <ellipse cx="1040" cy="500" rx="5" ry="2.8" transform="rotate(-40 1040 500)"/>
    <ellipse cx="690" cy="380" rx="4.6" ry="2.6" transform="rotate(70 690 380)"/>
    <ellipse cx="1150" cy="380" rx="5.2" ry="3" transform="rotate(12 1150 380)"/>
    <ellipse cx="420" cy="300" rx="4" ry="2.4" transform="rotate(-22 420 300)"/>
    <ellipse cx="1290" cy="520" rx="5.6" ry="3.2" transform="rotate(48 1290 520)"/>
  </g>

  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
