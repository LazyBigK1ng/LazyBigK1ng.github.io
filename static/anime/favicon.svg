    <circle cx="21" cy="42" r="8"/>
    <circle cx="43" cy="42" r="8"/>
    <circle cx="25" cy="19" r="7"/>
    <circle cx="39" cy="19" r="7"/>
  </g>

  <!-- 耳朵 -->
