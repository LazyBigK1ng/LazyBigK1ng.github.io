    <path d="M165 49 Q180 56 195 49" stroke="#ecd0ac" stroke-width="1.8" fill="none" opacity=".8"/>

    <path d="M193 42 C206 33 218 42 211 53 C205 62 193 58 195 47" fill="none" stroke="#f0d7b6" stroke-width="11" stroke-linecap="round" transform="translate(1,2)"/>
    <path d="M192 42 C205 33 217 42 210 53 C204 62 192 58 194 47" fill="none" stroke="url(#wWool)" stroke-width="9" stroke-linecap="round"/>
