  <g fill="none" stroke="#b48be0" stroke-linecap="round" stroke-linejoin="round">
    <path d="M292 122 h18 l-18 20 h18" stroke-width="4.4" opacity=".85"/>
    <path d="M314 90 h14 l-14 16 h14" stroke-width="3.8" opacity=".6"/>
    <path d="M332 62 h10 l-10 12 h10" stroke-width="3" opacity=".4"/>
