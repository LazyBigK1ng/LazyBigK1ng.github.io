      <stop offset=".5" stop-color="#fffaf0"/>
      <stop offset=".82" stop-color="#ffefd8"/>
      <stop offset="1" stop-color="#ffe4c4"/>
    </linearGradient>
    <linearGradient id="wWoolShade" x1=".3" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#f4dfc0"/>
      <stop offset="1" stop-color="#e7c9a3"/>
    </linearGradient>
    <linearGradient id="wFace" x1=".35" y1="0" x2=".65" y2="1">
      <stop offset="0" stop-color="#fff1de"/>
      <stop offset=".55" stop-color="#ffe0b8"/>
      <stop offset="1" stop-color="#ffc99a"/>
    </linearGradient>
    <linearGradient id="wHorn" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#9a6338"/>
      <stop offset=".5" stop-color="#7a4a2a"/>
      <stop offset="1" stop-color="#5a3418"/>
    </linearGradient>
    <linearGradient id="wSweater" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#fff9ea"/>
      <stop offset=".65" stop-color="#fff0cf"/>
      <stop offset="1" stop-color="#ffe1ac"/>
