    <ellipse cx="180" cy="430" rx="148" ry="40" fill="url(#wCushion)"/>
    <ellipse cx="180" cy="422" rx="118" ry="27" fill="url(#wCushionTop)"/>
    <ellipse cx="180" cy="414" rx="94" ry="21" fill="#f2b456" opacity=".55"/>
    <ellipse cx="180" cy="424" rx="126" ry="31" fill="none" stroke="#f0b652" stroke-width="2" stroke-dasharray="3 8" opacity=".55"/>
    <path d="M292 438 l4 8 8 4 -8 4 -4 8 -4 -8 -8 -4 8 -4z" fill="#fff3d1" opacity=".8"/>
  </g>

