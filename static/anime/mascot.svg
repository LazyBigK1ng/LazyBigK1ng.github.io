    <path d="M232 364 q13 2 13 11 q0 8 -13 8 q-13 0 -13 -8 q0 -9 13 -11z" fill="#fff7e5" stroke="#f0dcb6" stroke-width="1.5"/>
    <path d="M239 372 q-4 3 -8 0" stroke="#e0c79c" stroke-width="1.5" fill="none" stroke-linecap="round"/>

