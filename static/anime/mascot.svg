    <linearGradient id="wCushion" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffe9b3"/>
      <stop offset=".55" stop-color="#ffd989"/>
      <stop offset="1" stop-color="#f7bd5e"/>
