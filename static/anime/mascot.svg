  <g fill="#ffd76e">
    <path d="M46 132 l2.6 7.4 7.4 2.6 -7.4 2.6 -2.6 7.4 -2.6 -7.4 -7.4 -2.6 7.4 -2.6z" opacity=".9"/>
    <path d="M324 214 l2 5.6 5.6 2 -5.6 2 -2 5.6 -2 -5.6 -5.6 -2 5.6 -2z" opacity=".8"/>
