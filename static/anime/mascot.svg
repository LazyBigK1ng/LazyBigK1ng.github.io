    <ellipse cx="114" cy="340" rx="21" ry="27" fill="url(#wSweater)" transform="rotate(-8 114 340)"/>
    <ellipse cx="246" cy="340" rx="21" ry="27" fill="url(#wSweater)" transform="rotate(8 246 340)"/>
    <circle cx="110" cy="368" r="13" fill="url(#wPants)"/>
