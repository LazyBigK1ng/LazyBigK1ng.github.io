      <ellipse cx="0" cy="5" rx="7.6" ry="5.6" fill="#ffe6c4"/>
      <circle cx="-5.2" cy="-4" r="1.9" fill="#4a2f24"/>
      <circle cx="5.2" cy="-4" r="1.9" fill="#4a2f24"/>
