    <ellipse cx="181" cy="92" rx="35" ry="21" fill="#edd2ae"/>
    <ellipse cx="180" cy="88" rx="35" ry="21" fill="url(#wWool)"/>
    <path d="M148 92 Q180 104 212 92" stroke="#ecd0ac" stroke-width="2.2" fill="none" opacity=".8"/>

    <ellipse cx="182" cy="66" rx="26" ry="17" fill="url(#wWool)"/>
    <path d="M158 68 Q180 78 202 68" stroke="#ecd0ac" stroke-width="2" fill="none" opacity=".8"/>

